name = "files"
description = "Desktop file manager"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/files"
long-description = """
files is a desktop file manager written in Ada 2022 and rendered with Vulkan and
GLFW. Linux is the validated platform; Windows and macOS adapters live in Hostkit.
A live smoke check opens a real window and reports PASS, FAIL, or SKIP with
separate exit statuses, so a degenerate frame fails CI.
"""
tags = ["filemanager"]

executables = ["files"]

[[depends-on]]
gnat_native = "=15.2.1"

# Release manifest: published form of alire.toml with NO local path pins.
# The development alire.toml pins i18n/textrender/zlib/guikit to sibling
# checkouts; this file depends on their published crates instead. Keep the two
# manifests' metadata and dependency sets in sync (enforced by
# tools/bin/release_check).

[[depends-on]]
messages = "^0.1.0"

[[depends-on]]
hostkit = "^0.1.0"

[[depends-on]]
a11y = "^0.1.0"

[[depends-on]]
i18n = "^1.1.0"

[[depends-on]]
textrender = "^1.0.0"

[[depends-on]]
zlib = "^0.1.0"

[[depends-on]]
cryptolib = "^0.1.0"

[[depends-on]]
guikit = "^0.1.0"

[[depends-on]]
df_vulkan = "=0.1.0"

[[depends-on]]
openglada_glfw = "=0.9.0"

[[depends-on]]
utilada = "=2.9.0"

# Ship the generated runtime locale data in published builds too.
[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "tools/i18n_bundle/bundle_i18n_data.gpr", "-p", "-q"]

[[actions]]
type = "post-build"
command = ["tools/i18n_bundle/bin/bundle_i18n_data"]
