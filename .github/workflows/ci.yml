name: CI

# Builds the file manager and runs the AUnit test suite on Linux, macOS, and
# Windows (full cross-platform support is a project goal).
#
# PREREQUISITE: this project pins sibling crates by local path in alire.toml
# (project_tools, i18n, messages, textrender, zlib, guikit, hostkit, cryptolib,
#  a11ykit). The checkout step pins every sibling to a reviewed commit so a
#  historical Files revision never changes underneath a moving default branch.
# CI clones them next to the checkout. They must therefore exist as fetchable
# GitHub repos under the same owner. The immutable revisions below must remain
# fetchable so historical Files revisions keep testing the same dependency set.
#
# Every job runs a headless render smoke on the shipped binary
# (files --runtime-smoke): the snapshot -> frame-commands -> text/glyph path
# with no window or GPU, so the cross-platform render pipeline is validated
# end-to-end on macOS and Windows, not only through the in-process unit test.
# Every job additionally runs a required live GPU smoke: the full GLFW +
# Vulkan render path with the Mesa lavapipe software ICD (under Xvfb on
# Linux), structurally analysing the read-back framebuffer.
#
# All three jobs now build, link and run the suite on real runners. Getting
# there needed a platform abstraction for anything Linux-only that portable code
# had been calling directly (inotify, symlink), a real macOS metadata backend,
# and a suite that no longer assumes /tmp, a case-sensitive filesystem, /bin/true
# or a short list of mounted volumes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung child process used to park the suite until Actions killed the job six
    # hours later. Fail in minutes instead: nothing here legitimately takes 75
    # (the macOS Intel runner needs about 45 to reach the screen-reader steps).
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is the x86_64 macOS job, on the pinned toolchain.
        # macos-13 was retired on 2025-12-04 and its jobs now queue forever with
        # no runner; macos-15-intel replaces it and is the last x86_64 image
        # Actions will offer (available until August 2027).
        #
        # macos-latest is Apple silicon. gnat_native=15.2.1 ships no
        # aarch64-darwin binary (GNAT 15.2.0-1 was built for x86_64 only), so
        # that one job builds with 15.3.1, the nearest release that has one,
        # and rewrites the =15.2.1 pins in its own checkout to match. Every
        # other job, and every manifest in the repositories, stays on 15.2.1.
        os: [ubuntu-latest, macos-15-intel, windows-latest, macos-latest]
        include:
          - toolchain: gnat_native=15.2.1
          - os: macos-latest
            toolchain: gnat_native=15.3.1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: files

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            libgdk-pixbuf-2.0-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            fonts-dejavu-core \
            fonts-noto-color-emoji \
            mesa-vulkan-drivers \
            xvfb \
            libxcursor-dev \
            libxxf86vm-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            appstream \
            desktop-file-utils
          # OpenSSL for httpclient's TLS bridge (i18n's download_tzdb links it).
          sudo apt-get install -y libssl-dev

      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          # Runner images are published with a coherent Homebrew snapshot. Avoid
          # upgrading that snapshot here: on the Intel runner it rebuilds large,
          # unrelated dependency trees and can consume the entire job timeout.
          export HOMEBREW_NO_AUTO_UPDATE=1
          # The Intel image can retain a dangling openssl@1.1 symlink even after
          # Homebrew reports that formula as unlinked. An openssl@3 upgrade then
          # builds successfully but returns failure while trying to replace it.
          brew unlink openssl@1.1 || true
          if [ -L /usr/local/bin/openssl ] &&
             [[ "$(readlink /usr/local/bin/openssl)" == *openssl@1.1* ]]; then
            unlink /usr/local/bin/openssl
          fi
          # MoltenVK provides the Vulkan loader/ICD on macOS. gdk-pixbuf (which
          # pulls in glib) satisfies files.gpr's thumbnail-decoding switches. No
          # compression library is needed -- the zlib sibling crate's codecs are
          # all pure Ada.
          # openssl@3: httpclient's TLS bridge (i18n's download_tzdb links it).
          brew install vulkan-headers vulkan-loader molten-vk glfw gdk-pixbuf openssl@3

          # Homebrew on the x86_64 runner installs under /usr/local, which is not
          # on the linker's default search path; openssl@3 is keg-only, so add its
          # lib dir too.
          echo "LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"

      - name: Install system libraries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Alire's gnat_native is a mingw-w64 toolchain, so its `ld` needs mingw
          # import libraries (libvulkan.dll.a). The chocolatey vulkan-sdk ships
          # MSVC .lib files, which that linker cannot use -- take every library
          # from the MSYS2 installation preinstalled on the runner instead.
          #
          # vulkan-loader/glib2/gdk-pixbuf2 satisfy files.gpr's Windows linker
          # switches. No compression library is needed: the zlib sibling crate
          # implements every codec it supports -- Deflate, LZMA, PPMd, bzip2 and
          # zstd -- in Ada, and links none of them.
          pacman() { /c/msys64/usr/bin/pacman "$@"; }

          # The runner's MSYS2 keyring can go stale. Refresh it before installing;
          # package authenticity is mandatory even on a throwaway CI machine.
          pacman-key() { /c/msys64/usr/bin/pacman-key "$@"; }
          pacman-key --init || true
          pacman-key --populate msys2 || true

          # openssl: httpclient's TLS bridge (i18n's download_tzdb links it).
          packages="mingw-w64-x86_64-vulkan-loader
                    mingw-w64-x86_64-glib2
                    mingw-w64-x86_64-gdk-pixbuf2
                    mingw-w64-x86_64-glfw
                    mingw-w64-x86_64-openssl"

          # The mirrors stall often enough to matter -- a sync dies on "less than
          # 1 bytes/sec" rather than on anything we did -- so give each sync room
          # to be slow, and retry it before concluding anything is actually wrong.
          sync() {
            pacman -Sy --noconfirm --needed --disable-download-timeout "$@" $packages
          }

          synced=""
          for attempt in 1 2 3; do
            if sync; then synced=yes; break; fi
            echo "::warning::pacman sync attempt ${attempt} failed"
            sleep 15
          done

          [ -n "$synced" ] || { echo "::error::could not install signed MSYS2 packages"; exit 1; }

          # ld resolves -l<name> through LIBRARY_PATH; the DLLs must also be on
          # PATH for the test binary and the live app to start.
          # CPATH: httpclient's C bridge (built via i18n's download_tzdb) includes
          # <openssl/...>, so the mingw headers must be on the C include path.
          echo "CPATH=C:/msys64/mingw64/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=C:/msys64/mingw64/lib" >> "$GITHUB_ENV"
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Clone sibling crate dependencies
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          owner="${{ github.repository_owner }}"
          clone_at() {
            name="$1"
            revision="$2"
            git init "$name"
            git -C "$name" remote add origin "https://github.com/${owner}/${name}.git"
            git -C "$name" fetch --depth 1 origin "$revision"
            git -C "$name" checkout --detach FETCH_HEAD
          }
          clone_at project_tools bddc1ebef8572662167610c4dfbbc8a337b590c0
          clone_at i18n efd90bbb20decbfe041e6cfa4c17b658fa878781
          clone_at messages f3ceaf8f12e185749e4b844d5d770cc9b6ca931a
          clone_at humanize 6de85beba2287a8a82256d3d9fb9fc80baf9c6ff
          clone_at textrender c255b2959d9434f6102afc3fb767da7a58e86ac1
          clone_at zlib 174a6046226acf276a8cc4b2afcf1e10504e2b8a
          clone_at guikit 25d9e1c2c9724f9572ad35af8333e31d817b37ab
          clone_at hostkit 29cc9939500406f05669bf5478b78aa2b4fe22cc
          clone_at cryptolib 2e5c415f65fd49c2a496c97813740fa9b83e02fa
          # The a11y crate keeps the historical a11ykit repository name while
          # providing the native accessibility framework and compatibility API.
          clone_at a11ykit 067e3f7cb9395e98ef81b2392d2da168b6aaabaa
          # i18n's pre-build regeneration builds download_tzdb (httpclient with
          # ssllib/truststores, tarlib, awklib-on-regexp) and the CLDR import;
          # clone that complete pinned tool dependency closure too.
          clone_at httpclient 8191254695b1072b010ba23c6c6b29b0644f5277
          clone_at ssllib b1637fa14a30ab60b7ef6800533a88aed5a549bf
          clone_at truststores a6c86d29dd5f4ac0110425aa30d1a742ffc8a4d5
          clone_at tarlib 1a6f22ae04e89a2e634d00f283527d337e3d3b1b
          clone_at awklib 1ff50d0d729f403c1eb7cde7fdadad3e4e24c09c
          clone_at regexp 075f7e0dadde859b79e0026e9bbd715c7c753ad6

      - name: Compute an OS-stable i18n upstream cache key
        id: cldr_key
        if: hashFiles('i18n/cldr/upstream/source_manifest.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          # i18n's regen fetches three flaky sources -- cldr-json (GitHub), tzdb
          # (IANA) and the Unicode UCD/UCA/collation/transforms -- each of which
          # reaches Windows runners only intermittently. The next step caches all
          # of them. Versions are pinned in the tracked cldr manifest plus
          # hardcoded constants in the three downloader sources, so hash all four:
          # any version/logic change busts the cache. Strip CR so the key is
          # identical on every OS (git checks these out CRLF on Windows, LF else).
          h=$(cat \
                "$GITHUB_WORKSPACE/i18n/cldr/upstream/source_manifest.txt" \
                "$GITHUB_WORKSPACE/i18n/cldr/src/download_cldr_upstream.adb" \
                "$GITHUB_WORKSPACE/i18n/cldr/src/download_tzdb.adb" \
                "$GITHUB_WORKSPACE/i18n/cldr/src/fetch_ucd.adb" \
              | tr -d '\r' | git hash-object --stdin)
          echo "key=i18n-upstream-$h" >> "$GITHUB_OUTPUT"
      - name: Cache the i18n upstream download trees (CI-only; avoids flaky 82 MB+ downloads)
        # Only the raw download trees are cached (not the generated export), so
        # regeneration still runs with current i18n code. Matrix legs may race
        # on a cold key; later runs restore the shared cross-OS archive.
        # Inlined because files checks out siblings by hand, not via project_tools'
        # checkout-ada-siblings action.
        if: steps.cldr_key.outputs.key != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            i18n/cldr/upstream/cldr-json
            i18n/cldr/upstream/tzdb
            i18n/cldr/upstream/ucd
            i18n/cldr/upstream/ucd16
            i18n/cldr/upstream/uca
            i18n/cldr/upstream/collation
            i18n/cldr/upstream/transforms
            i18n/cldr/upstream/transforms_test
          key: ${{ steps.cldr_key.outputs.key }}
          enableCrossOsArchive: true

      - name: Set up Alire
        # v5 defaults to alr 2.1.0, whose index carries gnat_native 15.2.1.
        # v4 pins alr 2.0.2, whose older index cannot resolve it.
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          toolchain: ${{ matrix.toolchain }} gprbuild

      - name: Pin the Apple silicon toolchain in this checkout (macos-latest)
        # See the matrix: no 15.2.1 exists for aarch64-darwin. Every crate in
        # the closure pins gnat_native =15.2.1, so the solve would fail on the
        # toolchain this job can have; this job's copies pin 15.3.1 instead.
        if: matrix.os == 'macos-latest'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          find . -name alire.toml -not -path "*/alire/*" -print0 |
            xargs -0 grep -l 'gnat_native = "=15.2.1"' |
            while read -r manifest; do
              sed -i '' 's/gnat_native = "=15.2.1"/gnat_native = "=15.3.1"/' "$manifest"
              echo "pinned 15.3.1 in $manifest"
            done
          # GCC otherwise links against the Command Line Tools SDK, whose
          # library stubs name architectures (arm64e.x1) the selected Xcode's
          # ld does not know, and every link fails. The SDK of that Xcode
          # matches its ld.
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Give Alire's dependency solver room to finish (slow runners drop deps)
        # The default solver.timeout is 5 s (+10 s grace). On the slower macOS
        # runner the solve for files' large graph (df_vulkan, openglada_glfw,
        # utilada, plus the path-pinned siblings) does not finish in that window,
        # so Alire ships an INCOMPLETE solution -- silently dropping openglada and
        # libglfw3, after which the build dies with "opengl.gpr not found". The
        # graph is solvable (Linux and Windows solve it in time), so a generous
        # timeout just lets macOS return the same complete solution.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Build the application
        shell: bash
        working-directory: files
        run: alr --non-interactive build

      - name: Enforce style checks (development profile, Linux)
        # The -gnaty style switches (layout/-gnatyl, casing, spacing, blank
        # lines) live only in the development profile's config; the release
        # build above does not apply them. A clean development build on the
        # fresh checkout is therefore what actually catches a style regression
        # -- e.g. mis-indented code that a stale object file would otherwise
        # hide from an incremental build. Style is OS-independent, so run it
        # once on Linux.
        if: runner.os == 'Linux'
        shell: bash
        working-directory: files
        run: alr --non-interactive build --profiles=*=development

      - name: Headless render smoke (all platforms)
        # Runs the SHIPPED app binary's headless render path on every OS:
        # snapshot -> frame commands -> text/glyph batching, with no window or
        # GPU. This validates the cross-platform render pipeline end-to-end on
        # the real executable (not only through the in-process unit assertion).
        # The binary still links GLFW/Vulkan/gdk-pixbuf, so a missing dylib/DLL
        # at app startup on macOS or Windows fails here too. The verdict is the
        # fixed ASCII marker "runtime-smoke: PASS" (locale-independent).
        shell: bash
        working-directory: files
        env:
          FILES_FONT_PATH: >-
            ${{ runner.os == 'macOS' && '/System/Library/Fonts/Supplemental/Arial.ttf'
            || runner.os == 'Windows' && 'C:/Windows/Fonts/consola.ttf'
            || '' }}
        run: |
          set -euo pipefail
          if [ -f ./bin/files.exe ]; then
            export PATH="/c/msys64/mingw64/bin:$PATH"
            bin=./bin/files.exe
          else
            bin=./bin/files
          fi
          smoke_settings="$RUNNER_TEMP/files-runtime-smoke.conf"
          printf '[settings]\n' > "$smoke_settings"
          set +e
          out="$("$bin" --runtime-smoke --settings="$smoke_settings" . 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::headless render smoke exited with $code on ${{ matrix.os }}"
            exit "$code"
          fi
          pass_count="$(printf '%s\n' "$out" | awk '$0 == "runtime-smoke: PASS" { n++ } END { print n + 0 }')"
          if [ "$pass_count" -eq 1 ]; then
            echo "headless render pipeline is healthy on ${{ matrix.os }}"
          else
            echo "::error::headless render smoke did not report exactly one PASS on ${{ matrix.os }}"
            exit 1
          fi

      - name: Install and smoke-test packaged artifacts
        shell: bash
        working-directory: files
        env:
          FILES_FONT_PATH: >-
            ${{ runner.os == 'macOS' && '/System/Library/Fonts/Supplemental/Arial.ttf'
            || runner.os == 'Windows' && 'C:/Windows/Fonts/consola.ttf'
            || '' }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/files-install"
          alr --non-interactive install --prefix="$prefix"
          if [ -f "$prefix/bin/files.exe" ]; then
            export PATH="/c/msys64/mingw64/bin:$PATH"
            installed="$prefix/bin/files.exe"
          else
            installed="$prefix/bin/files"
          fi
          smoke_settings="$RUNNER_TEMP/files-installed-smoke.conf"
          printf '[settings]\n' > "$smoke_settings"
          out="$("$installed" --runtime-smoke --settings="$smoke_settings" .)"
          printf '%s\n' "$out"
          pass_count="$(printf '%s\n' "$out" | awk '$0 == "runtime-smoke: PASS" { n++ } END { print n + 0 }')"
          [ "$pass_count" -eq 1 ]

      - name: Build and run the test suite
        shell: bash
        working-directory: files/tests
        env:
          # The headless suite exercises font discovery; point it at a known
          # system font on macOS/Windows where the Linux font paths don't apply.
          FILES_FONT_PATH: >-
            ${{ runner.os == 'macOS' && '/System/Library/Fonts/Supplemental/Arial.ttf'
            || runner.os == 'Windows' && 'C:/Windows/Fonts/consola.ttf'
            || '' }}
        run: |
          alr --non-interactive build
          # The binary is tests.exe on Windows, and bash will not find it under
          # the Unix name.
          if [ -f ./bin/tests.exe ]; then
            # A missing DLL makes Windows refuse to start the process, and bash
            # reports that as a plain "not found" (exit 127) with no hint as to
            # which library is absent. Put the mingw runtime on PATH and name any
            # unresolved import, so a load failure says what it is.
            export PATH="/c/msys64/mingw64/bin:$PATH"
            if ldd ./bin/tests.exe | grep -i 'not found'; then
              echo "::error::the test binary has unresolved DLL imports (listed above)"
              exit 1
            fi
            ./bin/tests.exe
          else
            ./bin/tests
          fi

      - name: Run C bridges under UndefinedBehaviorSanitizer (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: files/tests
        env:
          # AddressSanitizer takes ownership of sigaltstack and is incompatible
          # with GNAT task stacks; UBSan instruments the bridges without that
          # runtime collision.
          FILES_CFLAGS: -fanalyzer -fsanitize=undefined -fno-omit-frame-pointer
          FILES_LDFLAGS: -fsanitize=undefined
        run: |
          alr --non-interactive build
          ./bin/tests

      - name: Live GPU smoke (Linux, software Vulkan)
        # Exercises the full GLFW + Vulkan render path headlessly under Xvfb with
        # the Mesa lavapipe software ICD, then structurally analyses the read-back
        # framebuffer. The job provisions both a display and software Vulkan,
        # so PASS is required; SKIP means the CI environment is broken.
        if: runner.os == 'Linux'
        shell: bash
        working-directory: files
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          set +e
          xvfb-run -a ./bin/files --live-smoke
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "live-smoke passed the structural framebuffer analysis"
          elif [ "$code" -eq 77 ]; then
            echo "::error::live-smoke skipped despite the provisioned display and Vulkan device"
            exit 1
          else
            echo "::error::live-smoke failed the structural analysis (exit $code)"
            exit "$code"
          fi

      - name: Live GPU smoke (Windows and macOS, software Vulkan)
        # The live smoke on the other hosts, with Mesa's lavapipe software
        # Vulkan driver: from MSYS2 on Windows, from Homebrew on macOS. The
        # Intel macOS runner has no Metal device, and MoltenVK aborts without
        # one, so it is only the fallback when Homebrew ships no lavapipe.
        if: runner.os != 'Linux'
        shell: bash
        working-directory: files
        env:
          FILES_FONT_PATH: >-
            ${{ runner.os == 'macOS' && '/System/Library/Fonts/Supplemental/Arial.ttf'
            || runner.os == 'Windows' && 'C:/Windows/Fonts/consola.ttf'
            || '' }}
          # The runner's name, outside the script: a run block with an expression
          # in it may not be longer than 21000 characters.
          MATRIX_OS: ${{ matrix.os }}
        run: |
          # A missing optional tool is information, not a reason to stop
          # before the smoke runs; the smoke's own exit decides the step.
          set +e +o pipefail
          export VK_LOADER_DEBUG=error,warn
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/msys64/mingw64/bin:$PATH"
            # MSYS2 no longer packages vulkan-tools; the loader's own log
            # (VK_LOADER_DEBUG) and the smoke's device line are the diagnostic.
            /c/msys64/usr/bin/pacman -S --noconfirm --needed --disable-download-timeout \
              mingw-w64-x86_64-mesa \
              || echo "::warning::could not install MSYS2 mesa"
            /c/msys64/usr/bin/pacman -Ql mingw-w64-x86_64-mesa | grep -iE "vulkan|icd|lvp" || true
            icd="$(ls /c/msys64/mingw64/share/vulkan/icd.d/*lvp*.json 2>/dev/null | head -1)"
            if [ -n "$icd" ]; then
              export VK_ICD_FILENAMES="$(cygpath -w "$icd")"
              # The runner's shell is elevated, and an elevated process's
              # loader ignores the driver variables and reads only the
              # registry, so register the driver there too.
              reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' //v "$(cygpath -w "$icd")" //t REG_DWORD //d 0 //f \
                || echo "::warning::could not register the lavapipe driver"
            fi
            bin=./bin/files.exe
          else
            HOMEBREW_NO_AUTO_UPDATE=1 brew install mesa || echo "::warning::could not install Homebrew mesa"
            ls "$(brew --prefix)/share/vulkan/icd.d" "$(brew --prefix)/etc/vulkan/icd.d" 2>/dev/null || true
            icd="$(ls "$(brew --prefix)"/{share,etc}/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)"
            [ -n "$icd" ] || icd="$(ls "$(brew --prefix)"/{share,etc}/vulkan/icd.d/MoltenVK_icd.json 2>/dev/null | head -1)"
            if [ -n "$icd" ]; then
              export VK_ICD_FILENAMES="$icd"
            fi
            bin=./bin/files
            # MoltenVK says why it gives up (no Metal device, for one).
            export MVK_CONFIG_LOG_LEVEL=2
            HOMEBREW_NO_AUTO_UPDATE=1 brew install vulkan-tools || true
          fi
          echo "VK_ICD_FILENAMES=${VK_ICD_FILENAMES:-<unset>}"
          if command -v vulkaninfo > /dev/null; then vulkaninfo --summary; fi
          "$bin" --live-smoke
          code=$?
          echo "live-smoke exit $code on $MATRIX_OS"
          if [ "$code" -eq 0 ]; then
            echo "live-smoke passed on $MATRIX_OS"
          else
            echo "::warning::live-smoke did not pass on $MATRIX_OS (exit $code)"
            exit "$code"
          fi

          # The screen reader's view of the same window: run the smoke again,
          # holding each frame, and walk files' window with the host's own
          # client API (UI Automation, AXUIElement) for the smoke's items.
          # Two windows, on two folders, so the walk can tell that each window
          # answers for its own part of the tree.
          log="$RUNNER_TEMP/held-smoke.txt"
          mkdir -p "$RUNNER_TEMP/first-window" "$RUNNER_TEMP/second-window"
          FILES_LIVE_SMOKE_HOLD=20 "$bin" --live-smoke "$RUNNER_TEMP/first-window" "$RUNNER_TEMP/second-window" > "$log" 2>&1 &
          smoke_pid=$!
          for _ in $(seq 1 120); do
            grep -q "live-smoke hold" "$log" && break
            sleep 1
          done
          # The clients are written out here: files keeps no helper scripts
          # outside Ada in the repository.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cat > "$RUNNER_TEMP/uia_walk.ps1" <<'WALK'
            # Walks the UI Automation tree of the running files window, the way Narrator
            # reaches it, and looks for an element named like Needle.
            param([string]$Needle = "smoke-item-", [int]$Seconds = 60)
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            $deadline = (Get-Date).AddSeconds($Seconds)
            # The files process that has windows: another one, still exiting
            # from an earlier step, may be listed first.
            $process = $null
            while ($process -eq $null -and (Get-Date) -lt $deadline) {
              foreach ($candidate in @(Get-Process -Name files -ErrorAction SilentlyContinue)) {
                $owns = New-Object System.Windows.Automation.PropertyCondition(
                  [System.Windows.Automation.AutomationElement]::ProcessIdProperty, $candidate.Id)
                if ([System.Windows.Automation.AutomationElement]::RootElement.FindFirst(
                      [System.Windows.Automation.TreeScope]::Children, $owns) -ne $null) {
                  $process = $candidate
                  break
                }
              }
              if ($process -eq $null) { Start-Sleep -Milliseconds 500 }
            }
            if ($process -eq $null) { Write-Output "files is not running"; exit 2 }
            Write-Output "files process $($process.Id)"
            $condition = New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::ProcessIdProperty, $process.Id)
            $found = $false
            $folders = @{}
            while ((-not $found -or $folders.Count -lt 2) -and (Get-Date) -lt $deadline) {
              $folders = @{}
              $windows = [System.Windows.Automation.AutomationElement]::RootElement.FindAll(
                [System.Windows.Automation.TreeScope]::Children, $condition)
              foreach ($window in $windows) {
                $all = $window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                                       [System.Windows.Automation.Condition]::TrueCondition)
                Write-Output ("window '{0}': {1} elements" -f $window.Current.Name, $all.Count)
                $shown = 0
                foreach ($element in $all) {
                  $name = $element.Current.Name
                  if ($shown -lt 25) {
                    Write-Output ("  {0} [{1}]" -f $name, $element.Current.ControlType.ProgrammaticName)
                    $shown++
                  }
                  if ($name -eq "first-window" -or $name -eq "second-window") {
                    $folders[$name] = $window.Current.NativeWindowHandle
                  }
                  if (-not $found -and $name -like "*$Needle*") {
                    # Read at once: the held smoke moves on to its next
                    # scenario while the walk goes on.
                    $found = $true
                    $c = $element.Current
                    $box = $c.BoundingRectangle
                    $frame = $window.Current.BoundingRectangle
                    # Pointing at it, as touch or the mouse does, finds an item.
                    $hitName = ""
                    try {
                      $center = New-Object System.Windows.Point(($box.Left + $box.Width / 2), ($box.Top + $box.Height / 2))
                      $hitName = [System.Windows.Automation.AutomationElement]::FromPoint($center).Current.Name
                    } catch { $hitName = "error: $_" }
                  }
                }
              }
              if (-not $found -or $folders.Count -lt 2) { Start-Sleep -Seconds 2 }
            }
            if (-not $found) {
              $all = [System.Windows.Automation.AutomationElement]::RootElement.FindAll(
                [System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)
              foreach ($top in $all) {
                Write-Output ("top-level: '{0}' process {1}" -f $top.Current.Name, $top.Current.ProcessId)
              }
              Write-Output "$Needle not reachable"; exit 1
            }
            # Each folder's name is reached in a window of its own.
            Write-Output ("folders: " + (($folders.GetEnumerator() | ForEach-Object { "$($_.Key) in window $($_.Value)" }) -join ", "))
            if ($folders.Count -lt 2 -or $folders["first-window"] -eq $folders["second-window"]) {
              Write-Output "the two windows do not each answer for their own folder"; exit 4
            }
            # What Narrator reads besides the name: what the element is, that
            # it is enabled, and where it is, on the screen inside its window.
            Write-Output ("found '{0}': {1}, enabled {2}, focus {3}, at {4} in window {5}" -f
              $c.Name, $c.ControlType.ProgrammaticName, $c.IsEnabled, $c.HasKeyboardFocus, $box, $frame)
            $problems = @()
            if ($c.ControlType -ne [System.Windows.Automation.ControlType]::ListItem) { $problems += "not a list item" }
            if (-not $c.IsEnabled) { $problems += "not enabled" }
            if ($box.IsEmpty -or $box.Width -le 0 -or $box.Height -le 0) { $problems += "no bounds" }
            elseif (-not $frame.Contains($box)) { $problems += "bounds outside its window" }
            Write-Output "pointing at it finds '$hitName'"
            if ($hitName -notlike "*$Needle*") { $problems += "pointing finds '$hitName'" }
            if ($problems.Count -gt 0) { Write-Output ("wrong: " + ($problems -join ", ")); exit 3 }
            exit 0
          WALK
            powershell -NoProfile -ExecutionPolicy Bypass -File "$(cygpath -w "$RUNNER_TEMP/uia_walk.ps1")" -Needle smoke-item-
            walk=$?
          else
            cat > "$RUNNER_TEMP/ax_walk.swift" <<'WALK'
            // Walks the accessibility tree of the running files process, the way
            // VoiceOver reaches it, and looks for an element named like the needle.
            import ApplicationServices
            import Foundation

            let pid = pid_t(CommandLine.arguments[1])!
            let needle = CommandLine.arguments.count > 2 ? CommandLine.arguments[2] : "smoke-item-"
            print("AXIsProcessTrusted:", AXIsProcessTrusted())
            var count = 0
            var found = false
            var item: AXUIElement? = nil
            // The item's answers, read the moment it is found: the held smoke
            // moves on to its next scenario while the walk goes on, and an
            // item gone from the list answers nothing.
            var item_role = "?"
            var item_enabled: Bool? = nil
            var item_box: CGRect? = nil
            var hit_title = "?"
            // Which top-level window each folder name was reached in, by the title
            // of the app's child the walk went through.
            var folders: [String: String] = [:]

            func attribute(_ element: AXUIElement, _ name: String) -> CFTypeRef? {
                var value: CFTypeRef?
                return AXUIElementCopyAttributeValue(element, name as CFString, &value) == .success ? value : nil
            }

            func point(_ element: AXUIElement, _ name: String) -> CGPoint? {
                guard let value = attribute(element, name) else { return nil }
                var result = CGPoint.zero
                return AXValueGetValue(value as! AXValue, .cgPoint, &result) ? result : nil
            }
            func size(_ element: AXUIElement, _ name: String) -> CGSize? {
                guard let value = attribute(element, name) else { return nil }
                var result = CGSize.zero
                return AXValueGetValue(value as! AXValue, .cgSize, &result) ? result : nil
            }

            func walk(_ element: AXUIElement, _ depth: Int, _ inside: String) {
                count += 1
                let role = attribute(element, kAXRoleAttribute) as? String ?? "?"
                let title = (attribute(element, kAXTitleAttribute) as? String)
                    ?? (attribute(element, kAXDescriptionAttribute) as? String) ?? ""
                let window = depth == 1 && role == "AXWindow" ? title : inside
                if title.contains(needle) && item == nil {
                    found = true
                    item = element
                    item_role = role
                    item_enabled = attribute(element, kAXEnabledAttribute) as? Bool
                    if let p = point(element, kAXPositionAttribute), let s = size(element, kAXSizeAttribute) {
                        item_box = CGRect(origin: p, size: s)
                        // Pointing at it, as the mouse does, finds an item.
                        var hit: AXUIElement?
                        if AXUIElementCopyElementAtPosition(AXUIElementCreateSystemWide(), Float(p.x + s.width / 2),
                                                            Float(p.y + s.height / 2), &hit) == .success, let hit = hit {
                            hit_title = (attribute(hit, kAXTitleAttribute) as? String)
                                ?? (attribute(hit, kAXDescriptionAttribute) as? String) ?? "?"
                        }
                    }
                }
                if (title == "first-window" || title == "second-window") && !window.isEmpty {
                    folders[title] = window
                }
                if count <= 40 || title.hasSuffix("-window") || role == "AXWindow" {
                    print(String(repeating: "  ", count: depth) + "\(role) \"\(title)\"")
                }
                if depth > 12 { return }
                for child in attribute(element, kAXChildrenAttribute) as? [AXUIElement] ?? [] {
                    walk(child, depth + 1, window)
                }
            }

            for _ in 0 ..< 30 where !found || folders.count < 2 {
                count = 0
                folders = [:]
                walk(AXUIElementCreateApplication(pid), 0, "")
                print("elements", count, "folders", folders)
                if !found || folders.count < 2 { Thread.sleep(forTimeInterval: 2) }
            }
            guard found, let found_item = item else { print("\(needle) not reachable"); exit(1) }
            // Each folder's name is reached in a window of its own.
            if folders.count < 2 || folders["first-window"] == folders["second-window"] {
                print("the two windows do not each answer for their own folder: \(folders)"); exit(4)
            }

            // What VoiceOver reads besides the name: what the element is, and
            // where it is, on the screen inside its window.
            _ = found_item
            var problems: [String] = []
            if item_role != "AXRow" { problems.append("role \(item_role), not AXRow") }
            if let box = item_box {
                let windows = attribute(AXUIElementCreateApplication(pid), kAXWindowsAttribute) as? [AXUIElement] ?? []
                print("found item: \(item_role), enabled \(String(describing: item_enabled)), at \(box)")
                let frames = windows.compactMap { window -> CGRect? in
                    guard let wp = point(window, kAXPositionAttribute), let ws = size(window, kAXSizeAttribute) else { return nil }
                    return CGRect(origin: wp, size: ws)
                }
                print("windows at \(frames)")
                if box.width <= 0 || box.height <= 0 { problems.append("no size") }
                else if !frames.contains(where: { $0.insetBy(dx: -1, dy: -1).contains(box) }) {
                    problems.append("bounds outside every window")
                }
            } else {
                problems.append("no position or size")
            }
            print("pointing at it finds \"\(hit_title)\"")
            if !hit_title.contains(needle) { problems.append("pointing finds \"\(hit_title)\"") }
            if !problems.isEmpty { print("wrong: " + problems.joined(separator: ", ")); exit(3) }
            exit(0)
          WALK
            swift "$RUNNER_TEMP/ax_walk.swift" "$smoke_pid" smoke-item-
            walk=$?
          fi
          kill "$smoke_pid" 2>/dev/null || true
          # Git Bash's kill can miss the native process behind the job.
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM files.exe > /dev/null 2>&1 || true; fi
          wait "$smoke_pid" 2>/dev/null || true
          echo "screen-reader client walk exit $walk on $MATRIX_OS"
          if [ "$walk" != 0 ]; then
            echo "--- the held smoke's own output:"
            cat "$log"
            echo "::error::the screen-reader client did not reach files' items on $MATRIX_OS"
            exit 1
          fi

          # What a screen reader does, not only reads: run files itself on a
          # folder, select an item as Narrator and VoiceOver do, and require
          # files to carry it out (the item becomes selected) and announce it
          # (an event reaches the client).
          folder="$RUNNER_TEMP/action-folder"
          mkdir -p "$folder"
          for name in alpha beta gamma; do echo "$name" > "$folder/$name.txt"; done
          # A11YKIT_TRACE: each event files raises, and the answer, in its output.
          A11YKIT_TRACE=1 "$bin" "$folder" > "$RUNNER_TEMP/files-app.txt" 2>&1 &
          app_pid=$!
          sleep 8
          if [ "$RUNNER_OS" = "Windows" ]; then
            cat > "$RUNNER_TEMP/uia_act.ps1" <<'ACT'
            # Selects an item of the running files window through UI Automation
            # and waits for files to select it, counting focus events.
            param([string]$Item = "beta.txt", [int]$Seconds = 60)
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            # The source as lines: a here-string's end must start its line,
            # which the indented script cannot give it.
            $source = @(
              'using System;',
              'using System.Runtime.InteropServices;',
              'using System.Windows.Automation;',
              'public static class FocusWatch {',
              '  public static int Count;',
              '  public static string Last = "";',
              '  public static int LastProcess;',
              '  public static int Selected;',
              '  public static string LastSelected = "";',
              '  public static int WindowSelected;',
              '  public static int WindowFocus;',
              '  public static int WindowProperty;',
              '  [DllImport("user32.dll")] static extern IntPtr GetForegroundWindow();',
              '  public static long Foreground() { return GetForegroundWindow().ToInt64(); }',
              '  public static void Start(int process) {',
              '    Automation.AddAutomationFocusChangedEventHandler((sender, e) => {',
              '      Count++;',
              '      try { Last = ((AutomationElement)sender).Current.Name; } catch (Exception) { }',
              '      try { LastProcess = ((AutomationElement)sender).Current.ProcessId; } catch (Exception) { }',
              '    });',
              '    Automation.AddAutomationEventHandler(SelectionItemPattern.ElementSelectedEvent,',
              '      AutomationElement.RootElement, TreeScope.Subtree, (sender, e) => {',
              '        try {',
              '          AutomationElement item = (AutomationElement)sender;',
              '          if (item.Current.ProcessId == process) { Selected++; LastSelected = item.Current.Name; }',
              '        } catch (Exception) { }',
              '      });',
              '  }',
              '  // The same events heard through files own window rather than the',
              '  // desktop: tells a lost desktop-wide registration from a lost event.',
              '  public static void StartOn(AutomationElement window) {',
              '    Automation.AddAutomationEventHandler(SelectionItemPattern.ElementSelectedEvent,',
              '      window, TreeScope.Subtree, (sender, e) => { WindowSelected++; });',
              '    Automation.AddAutomationEventHandler(AutomationElement.AutomationFocusChangedEvent,',
              '      window, TreeScope.Subtree, (sender, e) => { WindowFocus++; });',
              '    Automation.AddAutomationPropertyChangedEventHandler(window, TreeScope.Subtree,',
              '      (sender, e) => { WindowProperty++; }, SelectionItemPattern.IsSelectedProperty);',
              '  }',
              '}') -join "`n"
            Add-Type -ReferencedAssemblies UIAutomationClient, UIAutomationTypes, WindowsBase -TypeDefinition $source
            function Find-Item {
              # Every files process: one left over from an earlier step must
              # not hide the window that shows the item.
              $byName = New-Object System.Windows.Automation.PropertyCondition(
                [System.Windows.Automation.AutomationElement]::NameProperty, $Item)
              foreach ($process in @(Get-Process -Name files -ErrorAction SilentlyContinue)) {
                $byProcess = New-Object System.Windows.Automation.PropertyCondition(
                  [System.Windows.Automation.AutomationElement]::ProcessIdProperty, $process.Id)
                foreach ($window in [System.Windows.Automation.AutomationElement]::RootElement.FindAll(
                           [System.Windows.Automation.TreeScope]::Children, $byProcess)) {
                  $found = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $byName)
                  if ($found -ne $null) { return $found }
                }
              }
              return $null
            }
            # What the client does see, when the item is not there.
            function Show-Windows {
              foreach ($process in @(Get-Process -Name files -ErrorAction SilentlyContinue)) {
                $byProcess = New-Object System.Windows.Automation.PropertyCondition(
                  [System.Windows.Automation.AutomationElement]::ProcessIdProperty, $process.Id)
                foreach ($window in [System.Windows.Automation.AutomationElement]::RootElement.FindAll(
                           [System.Windows.Automation.TreeScope]::Children, $byProcess)) {
                  $names = @($window.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                               [System.Windows.Automation.Condition]::TrueCondition) |
                             Select-Object -First 30 | ForEach-Object { $_.Current.Name })
                  Write-Output ("process {0} window '{1}': {2}" -f $process.Id, $window.Current.Name, ($names -join ", "))
                }
              }
            }
            $deadline = (Get-Date).AddSeconds($Seconds)
            $element = $null
            while ($element -eq $null -and (Get-Date) -lt $deadline) {
              $element = Find-Item
              if ($element -eq $null) { Start-Sleep -Milliseconds 500 }
            }
            if ($element -eq $null) { Write-Output "$Item not found"; Show-Windows; exit 1 }
            $pattern = $element.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern)
            Write-Output "$Item selected before: $($pattern.Current.IsSelected)"
            # Where the foreground is: UI Automation may not report focus moving
            # inside a window that is not in front.
            $frontmost = [FocusWatch]::Foreground()
            $own = @([System.Windows.Automation.AutomationElement]::RootElement.FindAll(
                       [System.Windows.Automation.TreeScope]::Children,
                       (New-Object System.Windows.Automation.PropertyCondition(
                         [System.Windows.Automation.AutomationElement]::ProcessIdProperty,
                         $element.Current.ProcessId))) | ForEach-Object { [long]$_.Current.NativeWindowHandle })
            Write-Output ("foreground window {0}; files' windows {1}" -f $frontmost, ($own -join ", "))
            [FocusWatch]::Start($element.Current.ProcessId)
            $window = [System.Windows.Automation.TreeWalker]::ControlViewWalker.GetParent($element)
            while ($window -ne $null -and $window.Current.ControlType -ne [System.Windows.Automation.ControlType]::Window) {
              $window = [System.Windows.Automation.TreeWalker]::ControlViewWalker.GetParent($window)
            }
            if ($window -ne $null) { [FocusWatch]::StartOn($window) } else { Write-Output "no window above $Item" }
            $pattern.Select()
            $selected = $false
            $until = (Get-Date).AddSeconds(15)
            while (-not $selected -and (Get-Date) -lt $until) {
              Start-Sleep -Milliseconds 500
              $now = Find-Item
              if ($now -ne $null) {
                $selected = $now.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Current.IsSelected
              }
            }
            Start-Sleep -Seconds 2
            Write-Output ("$Item selected after: $selected; focus events $([FocusWatch]::Count), last on " +
                          "'$([FocusWatch]::Last)'; selection events $([FocusWatch]::Selected), last on " +
                          "'$([FocusWatch]::LastSelected)'; on files' window: selected $([FocusWatch]::WindowSelected), " +
                          "focus $([FocusWatch]::WindowFocus), IsSelected changes $([FocusWatch]::WindowProperty)")
            # A control on the client itself: a window that UI Automation
            # certainly announces. No focus event from Notepad either means
            # this client hears no events at all, whatever files raises.
            # What files' selection brought, before the control adds its own.
            $focusCount = [FocusWatch]::Count
            $focusProcess = [FocusWatch]::LastProcess
            $focusLast = [FocusWatch]::Last
            $selectedCount = [FocusWatch]::Selected
            # A classic Win32 program by its full path: the runner's notepad
            # alias no longer starts through Start-Process.
            $control = Start-Process -FilePath "$env:WINDIR\System32\charmap.exe" -PassThru -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 4
            Write-Output ("control: Character Map brought {0} focus events (last on '{1}')" -f
                          ([FocusWatch]::Count - $focusCount), [FocusWatch]::Last)
            if ($control -ne $null) { Stop-Process -Id $control.Id -Force -ErrorAction SilentlyContinue }
            if (-not $selected) { Write-Output "files did not select $Item"; exit 5 }
            # Announced either way a screen reader listens: the focus moving to
            # it, or ElementSelected on it.
            if ($focusCount -eq 0 -and $selectedCount -eq 0) {
              Write-Output "neither a focus nor a selection event reached the client"; exit 6
            }
            # Selecting is a single click: the focus stays in files. A file
            # opened in an editor means the request was carried out as an
            # activation instead.
            if ($focusCount -gt 0 -and $focusProcess -ne $element.Current.ProcessId) {
              Write-Output "the focus left files (to '$focusLast'): selecting opened $Item"; exit 7
            }
            exit 0
          ACT
            powershell -NoProfile -ExecutionPolicy Bypass -File "$(cygpath -w "$RUNNER_TEMP/uia_act.ps1")" -Item beta.txt
            act=$?
          else
            cat > "$RUNNER_TEMP/ax_act.swift" <<'ACT'
            // Selects an item of the running files process through the AX API and
            // waits for files to select it, counting notifications.
            import AppKit
            import ApplicationServices
            import Foundation

            let pid = pid_t(CommandLine.arguments[1])!
            let wanted = CommandLine.arguments.count > 2 ? CommandLine.arguments[2] : "beta.txt"
            var notifications: [String] = []

            func attribute(_ element: AXUIElement, _ name: String) -> CFTypeRef? {
                var value: CFTypeRef?
                return AXUIElementCopyAttributeValue(element, name as CFString, &value) == .success ? value : nil
            }
            func find(_ element: AXUIElement, _ depth: Int) -> AXUIElement? {
                let title = (attribute(element, kAXTitleAttribute) as? String)
                    ?? (attribute(element, kAXDescriptionAttribute) as? String) ?? ""
                if title == wanted { return element }
                if depth > 12 { return nil }
                for child in attribute(element, kAXChildrenAttribute) as? [AXUIElement] ?? [] {
                    if let hit = find(child, depth + 1) { return hit }
                }
                return nil
            }
            let app = AXUIElementCreateApplication(pid)
            var item: AXUIElement? = nil
            for _ in 0 ..< 60 where item == nil {
                item = find(app, 0)
                if item == nil { Thread.sleep(forTimeInterval: 1) }
            }
            guard let element = item else { print("\(wanted) not found"); exit(1) }
            print("\(wanted) selected before: \(String(describing: attribute(element, kAXSelectedAttribute)))")

            var observer: AXObserver?
            let callback: AXObserverCallback = { _, _, name, _ in
                notifications.append(name as String)
            }
            if AXObserverCreate(pid, callback, &observer) == .success, let observer = observer {
                for name in [kAXFocusedUIElementChangedNotification, kAXLayoutChangedNotification,
                             kAXSelectedChildrenChangedNotification] {
                    _ = AXObserverAddNotification(observer, app, name as CFString, nil)
                }
                CFRunLoopAddSource(CFRunLoopGetCurrent(), AXObserverGetRunLoopSource(observer), .defaultMode)
            }

            let set = AXUIElementSetAttributeValue(element, kAXSelectedAttribute as CFString, kCFBooleanTrue)
            print("set AXSelected: \(set.rawValue)")
            var selected = false
            for _ in 0 ..< 30 where !selected {
                CFRunLoopRunInMode(.defaultMode, 0.5, false)
                if let now = find(app, 0) {
                    selected = (attribute(now, kAXSelectedAttribute) as? Bool) ?? false
                }
            }
            CFRunLoopRunInMode(.defaultMode, 2, false)
            print("\(wanted) selected after: \(selected); notifications \(notifications)")
            if !selected { print("files did not select \(wanted)"); exit(5) }
            if notifications.isEmpty { print("no notification reached the client"); exit(6) }
            // Selecting is a single click: nothing is opened. TextEdit running
            // means the request was carried out as an activation instead.
            if !NSRunningApplication.runningApplications(withBundleIdentifier: "com.apple.TextEdit").isEmpty {
                print("TextEdit is running: selecting opened \(wanted)"); exit(7)
            }
            exit(0)
          ACT
            swift "$RUNNER_TEMP/ax_act.swift" "$app_pid" beta.txt
            act=$?
          fi
          kill "$app_pid" 2>/dev/null || true
          echo "screen-reader action exit $act on $MATRIX_OS"
          if [ "$act" != 0 ]; then
            echo "::error::files did not carry out or announce a screen reader's selection on $MATRIX_OS"
            echo "--- files' own output:"
            cat "$RUNNER_TEMP/files-app.txt" || true
            exit 1
          fi

      - name: Repository lint and architecture guardrails (check_all, Linux)
        # Source-level validation that build+test do not cover: style, format,
        # GNATdoc, hard-coded user-visible text, localization-key existence, and
        # the architecture guardrails (rendering/window/events must-not-do-X,
        # applied across each unit and its subunits). These are OS-independent,
        # so check_all runs once on Linux. It shells out to `alr` to compile
        # every unit and run the contract suite; the application build and
        # the i18n upstream cache above mean it re-downloads nothing.
        if: runner.os == 'Linux'
        shell: bash
        working-directory: files
        run: |
          (cd tools && alr --non-interactive build)
          ./tools/bin/release_check
          ./tools/bin/check_all
      - name: Validate desktop packaging metadata (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: files
        run: |
          appstreamcli validate --no-net share/metainfo/dk.bracke.files.metainfo.xml
          desktop-file-validate share/applications/files.desktop
      # A catalogue can be well-formed and still have drifted from the
      # messages it translates: a key with no original, an argument dropped so
      # the text renders without the value it was about, an option name
      # translated into a word the program rejects. The rule lives with the
      # catalogue format, in the messages crate.
      - name: Check the message catalogue
        # Linux-only, with an explicit shell, for the same two reasons as
        # check_all above: a catalogue is data, so the answer cannot differ by
        # host, and PowerShell -- the default shell on the Windows runner --
        # reads the leading "--" of an option as its own decrement operator and
        # refuses to parse the line.
        if: runner.os == 'Linux'
        shell: bash
        working-directory: messages/tools/catalog_check
        run: |
          alr --non-interactive build
          ./bin/catalog_check ../../../files/share/files.catalog \
            --verbatim=files
