name = "files"
description = "Desktop file manager"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/files"
long-description = """
files is a desktop file manager written in Ada 2022 and rendered with Vulkan and
GLFW. Linux is the validated platform; Windows and macOS adapters live in Hostkit.
A live smoke check opens a real window and reports PASS, FAIL, or SKIP with
separate exit statuses, so a degenerate frame fails CI.
"""
tags = ["filemanager"]

executables = ["files"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
i18n = "^1.1.0"

[[depends-on]]
messages = "^0.1.0"

[[depends-on]]
hostkit = "^0.1.0"

[[pins]]
hostkit = { path = "../hostkit" }
i18n = { path = "../i18n" }
messages = { path = "../messages" }

[[depends-on]]
textrender = "^1.0.0"

[[pins]]
textrender = { path = "../textrender" }

[[depends-on]]
zlib = "^0.1.0"

[[depends-on]]
cryptolib = "^0.1.0"

[[pins]]
zlib = { path = "../zlib" }

[[depends-on]]
guikit = "^0.1.0"

[[pins]]
guikit = { path = "../guikit" }

[[depends-on]]
a11y = "^0.1.0"

[[pins]]
a11y = { path = "../a11ykit" }

# File-content verification uses cryptolib directly. Alire honours pins only in
# the root crate, so every root that builds files must pin it too.
[[pins]]
cryptolib = { path = "../cryptolib" }

[[depends-on]]
df_vulkan = "=0.1.0"

[[depends-on]]
openglada_glfw = "=0.9.0"

[[depends-on]]
utilada = "=2.9.0"

# Bundle i18n's generated locale data into share/i18n after every build. The
# load-only i18n serves formatting from those files at runtime, so a deployed
# bin/files must ship them (found at Exe/../share/i18n). bundle_i18n_data is a
# standalone Ada tool (tools/i18n_bundle) kept out of the app's own bin so it is
# never installed; build it, then run it. Both steps are plain executables --
# no shell. gprbuild is incremental, so the build step is a no-op once current.
[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "tools/i18n_bundle/bundle_i18n_data.gpr", "-p", "-q"]

[[actions]]
type = "post-build"
command = ["tools/i18n_bundle/bin/bundle_i18n_data"]

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3). guikit is shared by files and launcher, and the profile lives in
# its generated config gpr: if one root built it at -O3 and the other at -Og, each
# switch would silently force a full guikit rebuild. Keeping every root on the same
# profile lets them share object files.
[build-profiles]
"*" = "development"
