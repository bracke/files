name = "tests"
description = "Testsuite for files"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = ""
tags = ["tests"]

executables = ["tests"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
files = "*"

[[depends-on]]
hostkit = "*"

[[pins]]
hostkit = { path = "../../hostkit" }
files = { path = ".." }

[[depends-on]]
project_tools = "*"

[[pins]]
project_tools = { path = "../../project_tools" }

[[depends-on]]
guikit = "*"

[[pins]]
guikit = { path = "../../guikit" }

[[depends-on]]
a11ykit = "*"

[[pins]]
a11ykit = { path = "../../a11ykit" }

# Pins are root-only in Alire: this root builds zlib, so it must pin cryptolib.
[[pins]]
cryptolib = { path = "../../cryptolib" }

[[depends-on]]
aunit = "^26.0.0"

# `alr test` with no test action defined does not run anything: it falls back to
# `alr build --release` and reports success, which is how the documented
# verification chain came to build the suite at -O3 and never run a single case.
#
# Two actions, in order, because a test action replaces the build rather than
# following it -- without the first, `alr test` would run whatever binary was
# lying in bin/ and call a stale pass a pass. The development profile matches
# the one below, so this shares object files rather than forcing a rebuild.
[[actions]]
type = "test"
command = ["alr", "-n", "build", "--profiles=*=development"]

[[actions]]
type = "test"
command = ["bin/tests"]

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3). guikit is shared by files and launcher, and the profile lives in
# its generated config gpr: if one root built it at -O3 and the other at -Og, each
# switch would silently force a full guikit rebuild. Keeping every root on the same
# profile lets them share object files.
[build-profiles]
"*" = "development"
